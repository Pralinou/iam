---
# Image Keycloak
app_image: quay.io/keycloak/keycloak:24.0

# Nom du container
app_container_name: keycloak

# Commande de démarrage Keycloak
app_command: start

# Politique de redémarrage du container
app_restart_policy: unless-stopped

# Port d'écoute Keycloak (exposé sur l'hôte)
app_port: 8080

# Variables d'environnement du container Keycloak
# Les secrets sont définis dans group_vars/app_servers_vault.yml (chiffré ansible-vault)
app_env:
  KC_DB: postgres
  KC_DB_URL: "jdbc:postgresql://{{ hostvars[groups['db'][0]]['ansible_host'] }}:{{ db_port }}/{{ db_name }}"
  KC_DB_USERNAME: "{{ db_user }}"
  KC_DB_PASSWORD: "{{ vault_db_password }}"
  KC_HOSTNAME: "{{ hostvars[groups['lb'][0]]['ansible_host'] }}"
  KC_HTTP_ENABLED: "true"
  KC_PROXY: edge
  KEYCLOAK_ADMIN: "{{ vault_kc_admin_user }}"
  KEYCLOAK_ADMIN_PASSWORD: "{{ vault_kc_admin_password }}"
